<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Ingrediente</title>
    <link rel="stylesheet" href="form.css">
    <script src="scriptForm.js" defer></script>
</head>
<body>

    <div class="formulario">
        <nav class="menu">
            <a href="index.html">Início</a>
            <a href="form.html">Bolos</a>
            <a href="usuario.html">Usuários</a>
            <a href="categoria.html">Categorias</a>
            <a href="cobertura.html">Coberturas</a>
            <a href="ingrediente.html">Ingredientes</a>
        </nav>

        <h2>Cadastrar Ingrediente</h2>
        <form id="meuformulario">
            <div class="campo">
                <label for="NomeIngrediente">Nome do Ingrediente</label>
                <input type="text" id="NomeIngrediente" name="NomeIngrediente" placeholder="Ex: Farinha de trigo" maxlength="100" required>
            </div>

            <input type="submit" value="Cadastrar Ingrediente">
        </form>
    </div>

    <section class="secao-bolos">
        <h2>Ingredientes cadastrados</h2>
        <div class="bolos-container" id="lista" data-rota="/api/ingredientes" data-id="idIngrediente"></div>
    </section>
</body>
</html>
